# mkdocs.yml — Material theme for agentic-memory docs.
#
# Build:
#     pip install mkdocs-material
#     mkdocs serve         # local preview at http://127.0.0.1:8000
#     mkdocs build         # static site in site/
#
# Deploy options:
#     mkdocs gh-deploy     # GitHub Pages
#     mkdocs build && rsync -av site/ user@host:/var/www/agentic-memory/
#     Docker: docker run --rm -v $PWD:/docs squidfunk/mkdocs-material build

site_name: Agentic Memory
site_description: Local-first persistent memory for AI agents — 17 CORE MCP tools, Python/TypeScript SDK, REST API
site_author: Arka Ai

repo_url: https://github.com/ArkaAiAdmin/agentic-memory-local
repo_name: ArkaAiAdmin/agentic-memory-local
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: ArkaAiAdmin
      repo: agentic-memory-local

plugins:
  - search

strict: false

nav:
  - Home: index.md
  - Quick Start:
      - guides/quick-start.md
      - guides/langchain.md
      - guides/crewai.md
  - Architecture:
      - architecture.md
      - architecture/overview.md
      - architecture/subsystems.md
  - Concepts:
      - concepts/why-markdown.md
      - concepts/search-pipeline.md
      - concepts/knowledge-graph.md
      - concepts/temporal-kg.md
      - concepts/tier-system.md
      - concepts/background-tasks.md
      - concepts/multi-agent-sync.md
      - concepts/security-model.md
  - How-to Guides:
      - how-to/integrate-claude-code.md
      - how-to/multi-project.md
      - how-to/custom-entity-types.md
      - how-to/debug-search.md
      - how-to/debug-write-journal.md
      - how-to/cron-setup.md
      - how-to/walkthrough.md
      - how-to/build-docs-site.md
      - how-to/performance-benchmarks.md
      - Maintainer:
          - how-to/add-an-mcp-tool.md
          - how-to/add-a-cron-job.md
          - how-to/add-a-claude-code-hook.md
          - how-to/run-a-migration.md
  - Integrations:
      - integrations/overview.md
      - integrations/langchain.md
      - integrations/crewai.md
      - integrations/roadmap.md
  - Reference:
      - api/python-sdk.md
      - api/typescript-sdk.md
      - api/rest-api.md
      - reference/mcp-tools.md
      - reference/configuration.md
      - reference/schema.md
      - MCP_SURFACE.md
      - AGENT_QUICKSTART.md
      - durability.md
      - OPERATOR_RELOAD_COMMANDS.md
      - kg_dashboard.md
  - Explanation:
      - explanation/design-decisions.md
      - explanation/boot-sequence.md
      - explanation/comparison.md
  - Operations:
      - self-hosting.md
      - llm-providers.md
      - okf-obsidian-migration.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ArkaAiAdmin/agentic-memory-local
  generator: false
