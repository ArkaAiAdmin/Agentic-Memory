repos:
  - repo: local
    hooks:
      # Scoped ruff + mypy gates for the config-drift surface. Scoping is
      # intentional: repo-wide `ruff check .` still carries 84 pre-existing
      # errors (broadening is a separate future PR), so an unscoped hook would
      # be permanently red. Test files in this surface are owned/fixed by other
      # sub-agents and are intentionally excluded; infra/toml_watch.py is
      # excluded from the mypy hook (owned by another sub-agent, 2 pre-existing
      # no-any-return errors).
      - id: ruff
        name: ruff (config-drift surface)
        description: Lint the config-drift surface (scoped; repo-wide ruff has 84 pre-existing errors)
        entry: venv/bin/python -m ruff check --no-fix
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        args:
          - infra/config_drift.py
          - infra/config_drift_policy.py
          - infra/config_drift_tier_patch.py
          - infra/toml_watch.py
          - infra/policy_hash_cache.py
          - infra/policy_hash_fetcher.py
          - infra/policy_hash_diff.py
          - mcp_surface/mcp_maintenance_policy_hash.py
      - id: mypy
        name: mypy (config-drift surface)
        description: Typecheck the config-drift surface (toml_watch.py owned by another sub-agent)
        entry: venv/bin/python -m mypy --follow-imports=silent
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        args:
          - infra/config_drift.py
          - infra/config_drift_policy.py
          - infra/config_drift_tier_patch.py
          - infra/policy_hash_cache.py
          - infra/policy_hash_fetcher.py
          - infra/policy_hash_diff.py
          - mcp_surface/mcp_maintenance_policy_hash.py
      - id: no-direct-pytest-eval
        name: no-direct-pytest-eval
        description: Reject `pytest eval/` unless run via eval/run_full_suite.py (MPS safety)
        entry: venv/bin/python scripts/check_pytest_runner.py
        language: system
        pass_filenames: false
        always_run: true
      - id: tool-registry-drift-check
        name: tool-registry-drift-check
        description: Detect drift between tool_registry.py and actual @mcp.tool definitions
        entry: venv/bin/python scripts/tool_drift_check.py
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: schema-version-check
        name: schema-version-check
        description: Verify schema version in migration_runner.py matches applied migrations
        entry: venv/bin/python scripts/schema_version_check.py
        language: system
        types: [python, sql]
        pass_filenames: false
        always_run: true
      - id: doc-meta-fresh
        name: doc-meta-fresh
        description: Verify docs/_meta.json matches live code (schema version, tool/migration/cron/test counts, LOC)
        entry: venv/bin/python scripts/verify_doc_meta.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false
        always_run: true
      - id: doc-refs-current
        name: doc-refs-current
        description: Verify generated reference docs (mcp-tools, schema, configuration) match live code
        entry: venv/bin/python scripts/gen_mcp_tools_doc.py --check && venv/bin/python scripts/gen_schema_doc.py --check && venv/bin/python scripts/gen_config_doc.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: update-docs-fresh
        name: update-docs-fresh
        description: Rule 24 — run `make update-docs` and fail if docs drift from code (docs must commit with code)
        entry: venv/bin/python scripts/check_update_docs.py
        language: system
        pass_filenames: false
        always_run: true
      - id: agents-md-contract
        name: agents-md-contract
        description: "Rule 22/23 — AGENTS.md stays a stable contract: line budget, no volatile counts in prose, links resolve"
        entry: venv/bin/python scripts/check_agents_md.py
        language: system
        pass_filenames: false
        always_run: true
      - id: check-worktrees
        name: check-worktrees
        description: Rule 16 — fail if more than one git worktree is registered (stale metadata is pruned, not counted)
        entry: venv/bin/python scripts/check_worktrees.py
        language: system
        pass_filenames: false
        always_run: true
      - id: no-todo-markers
        name: no-todo-markers
        description: Rule 17 — reject TODO/FIXME/HACK markers on lines added in the staged diff
        entry: venv/bin/python scripts/check_todo_markers.py
        language: system
        pass_filenames: false
        always_run: true
      - id: secret-scan
        name: secret-scan
        description: Rule 18 — reject credential-looking patterns on lines added in the staged diff
        entry: venv/bin/python scripts/check_secrets.py
        language: system
        pass_filenames: false
        always_run: true
