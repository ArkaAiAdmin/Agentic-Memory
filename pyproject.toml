[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

# 2026-06-20: L7 audit fix — explicit Python version floor.
# CI matrix tests 3.11, 3.12, 3.14. Anything below 3.11 will fail
# (we use `tomllib`, `Literal[False]`, `match`/`case`, and other
# 3.10+ syntax). README should mirror this; this file is the
# authoritative source.
[project]
name = "agentic-memory"
version = "1.1.0"
description = "Local-first persistent memory for AI agents — markdown-native, MCP server with 117 tools (25 CORE + 92 ADMIN, 3 DEPRECATED), temporal KG, CRDT sync, hybrid search. Apache 2.0."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Agentic Memory Contributors"},
]
keywords = [
    "ai", "memory", "agents", "llm", "knowledge-graph",
    "mcp", "model-context-protocol", "sqlite", "fts5",
    "local-first", "rag", "semantic-search", "crdt",
    "claude-code", "opencode", "agentic-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0,<2",
    "numpy>=2.0.0,<3",
]

[project.optional-dependencies]
embeddings = [
    "model2vec>=0.8.0,<1",
    "usearch>=2.0.0,<3",
]
reranker = [
    "torch>=2.0.0,<3",
    "transformers>=4.0.0,<5",
]
ltr = [
    "lightgbm>=4.0.0,<5",
]
ner = [
    "spacy>=3.8.0,<4",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.0.0",
]
langchain = [
    "langchain-core>=1.1.0",
    "langchain-community>=0.4.0",
]
dashboard = [
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "streamlit>=1.30.0",
    # Headless browser (chrome-headless-shell) for agent-side dashboard
    # verification. The browser binary is fetched separately:
    #   python -m playwright install chromium
    "playwright>=1.40.0",
]
crewai = [
    "crewai>=0.80,<1.0",
    "langchain-core>=0.2.0",
]
all = [
    "agentic-memory[langchain,crewai,embeddings,reranker,ltr,ner]",
]

# Console scripts — installed by `pip install -e .`
# The first one is the SDK CLI; the rest mirror the existing
# cli.py subcommands and let the package fully replace the
# legacy CLI invocations.
[project.scripts]
agentic-memory = "agentic_memory:main"
agentic-memory-server = "cli:server_main"
agentic-memory-search = "cli:search_main"
agentic-memory-rebuild = "cli:rebuild_main"
agentic-memory-backfill = "cli:backfill_main"
agentic-memory-consolidate = "cli:consolidate_main"
agentic-memory-integrity = "cli:integrity_main"
agentic-memory-tier = "cli:tier_main"
agentic-memory-compact = "cli:compact_main"
agentic-memory-bootstrap = "cli:bootstrap_main"
agentic-memory-worker = "cli:worker_main"
agentic-memory-sync = "cli:sync_main"
agentic-memory-init = "cli:init_main"
agentic-memory-doctor = "cli:doctor_main"
agentic-memory-status = "cli:status_main"
agentic-memory-version = "cli:version_main"
agentic-memory-install-mcp = "cli:install_mcp_main"
agentic-memory-dashboard = "cli:dashboard_main"
agentic-memory-api = "cli:api_server_main"


[project.urls]
Homepage = "https://github.com/ArkaAiAdmin/Agentic-Memory"
Documentation = "https://github.com/ArkaAiAdmin/Agentic-Memory/tree/main/docs"
Repository = "https://github.com/ArkaAiAdmin/Agentic-Memory"
Issues = "https://github.com/ArkaAiAdmin/Agentic-Memory/issues"
Changelog = "https://github.com/ArkaAiAdmin/Agentic-Memory/blob/main/CHANGELOG.md"

# Package discovery is handled by setup.py, which auto-discovers
# both root-level .py modules and top-level packages (infra/, save/,
# search/, cron/, hooks/, etc.) needed for the full MCP server install.

[tool.coverage.run]
source = ["."]
omit = [
    "eval/*",
    "venv/*",
    "memory/*",
    "*/test_*.py",
    "conftest.py",
]
data_file = ".coverage"

[tool.coverage.report]
show_missing = true
skip_covered = true
# Aligned with CI (--cov-fail-under=70 in .github/workflows/ci.yml).
fail_under = 70

[tool.pyright]
include = ["*.py"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "venv",
    "memory",
    "eval",
]
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"
reportMissingImports = "warning"

# 2026-06-20: mypy is the type checker actually used in CI. The
# pyright config above is kept for editor support but mypy drives
# the gate. Mypy is configured to be lenient on missing type stubs
# (third-party libs we don't own) and on missing return annotations
# (legacy code; new code should annotate).
#
# 2026-06-20: Baseline reduced to 0. All 141 errors have been fixed
# across 28 files. CI now fails on any new mypy error.
