[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

# 2026-06-20: L7 audit fix — explicit Python version floor.
# CI matrix tests 3.11, 3.12, 3.14. Anything below 3.11 will fail
# (we use `tomllib`, `Literal[False]`, `match`/`case`, and other
# 3.10+ syntax). README should mirror this; this file is the
# authoritative source.
[project]
name = "agentic-memory"
version = "1.0.0"
description = "Local-first persistent memory for AI agents — Mem0-compatible SDK, MCP server, and 79 MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
keywords = ["ai", "memory", "agents", "llm", "knowledge-graph", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    {name = "Agentic Memory Contributors"},
]
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
embeddings = [
    "model2vec>=0.8.0",
    "numpy>=2.0.0",
    "usearch>=2.0.0",
]
reranker = [
    "torch>=2.0.0",
    "transformers>=4.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.0.0",
]

# Console scripts — installed by `pip install -e .`
# The first one is the SDK CLI; the rest mirror the existing
# cli.py subcommands and let the package fully replace the
# legacy CLI invocations.
[project.scripts]
agentic-memory = "agentic_memory:main"
agentic-memory-server = "cli:server_main"
agentic-memory-search = "cli:search_main"
agentic-memory-rebuild = "cli:rebuild_main"
agentic-memory-backfill = "cli:backfill_main"
agentic-memory-consolidate = "cli:consolidate_main"
agentic-memory-integrity = "cli:integrity_main"
agentic-memory-tier = "cli:tier_main"
agentic-memory-compact = "cli:compact_main"
agentic-memory-bootstrap = "cli:bootstrap_main"
agentic-memory-worker = "cli:worker_main"
agentic-memory-sync = "cli:sync_main"

[project.urls]
Homepage = "https://github.com/ArkaAiAdmin/Agentic-Memory"
Documentation = "https://github.com/ArkaAiAdmin/Agentic-Memory/tree/main/docs"
Repository = "https://github.com/ArkaAiAdmin/Agentic-Memory"
Issues = "https://github.com/ArkaAiAdmin/Agentic-Memory/issues"

# setuptools package config: the SDK lives in the `agentic_memory/`
# subpackage. The repo root is also part of the install so legacy
# top-level imports (`from sdk import Memory`, `from config import
# get_config`, etc.) keep working.
[tool.setuptools.packages.find]
include = ["agentic_memory*"]
where = ["."]

[tool.coverage.run]
source = ["."]
omit = [
    "eval/*",
    "venv/*",
    "memory/*",
    "*/test_*.py",
    "conftest.py",
]
data_file = ".coverage"

[tool.coverage.report]
show_missing = true
skip_covered = true
# 2026-06-20: was 0, which silently disabled the coverage gate.
# Actual measured coverage is 63% (2026-06-20). Set fail_under to
# 60 so the gate is meaningful but doesn't immediately fail CI.
# Next milestone: raise to 70% as we add tests for low-coverage modules.
fail_under = 60

[tool.pyright]
include = ["*.py"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "venv",
    "memory",
    "eval",
]
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"
reportMissingImports = "warning"

# 2026-06-20: mypy is the type checker actually used in CI. The
# pyright config above is kept for editor support but mypy drives
# the gate. Mypy is configured to be lenient on missing type stubs
# (third-party libs we don't own) and on missing return annotations
# (legacy code; new code should annotate).
#
# 2026-06-20: Baseline reduced to 0. All 141 errors have been fixed
# across 28 files. CI now fails on any new mypy error.
[tool.mypy]
python_version = "3.11"
# Run on the 5 core modules covered by the gate.
files = [
    "adaptive_retention.py",
    "save_pipeline.py",
    "search_pipeline.py",
    "sync_server.py",
    "mcp_memory.py",
]
disallow_untyped_defs = false  # legacy; tighten over time
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
# Exclude tests and the live store from mypy runs.
 exclude = [
    "eval/.*",
    "memory/.*",
    "venv/.*",
    "\\.venv/.*",
]

[tool.pytest.ini_options]
testpaths = ["eval"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (use -m 'not slow' to skip)",
]
