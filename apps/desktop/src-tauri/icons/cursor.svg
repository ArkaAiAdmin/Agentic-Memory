<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ec8ff"/>
      <stop offset="100%" stop-color="#4a9eff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="52" fill="#0f1729"/>
  <g filter="url(#shadow)" transform="translate(52, 28)">
    <path d="M 26 10 L 26 78 L 46 58 L 78 106 L 102 98 L 70 50 L 98 50 Z" fill="url(#bodyGrad)" stroke="#a3d5ff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 26 10 L 26 78 L 46 58 L 78 106 L 102 98 L 70 50 L 98 50 Z" fill="none" stroke="#ffffff" stroke-width="1" stroke-linejoin="round" opacity="0.35"/>
  </g>
  <circle cx="196" cy="60" r="18" fill="#4a9eff" filter="url(#glow)" opacity="0.9"/>
  <circle cx="196" cy="60" r="8" fill="#ffffff" opacity="0.9"/>
</svg>
