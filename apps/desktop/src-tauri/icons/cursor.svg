<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#1a1f35"/>
      <stop offset="50%" stop-color="#0d1222"/>
      <stop offset="100%" stop-color="#080b14"/>
    </linearGradient>
    <!-- Cursor body gradient -->
    <linearGradient id="cursorGrad" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e8f4ff"/>
      <stop offset="100%" stop-color="#b8dcff"/>
    </linearGradient>
    <!-- Accent glow gradient -->
    <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5ba8ff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#3d7fff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <!-- Memory ring gradient -->
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ba8ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <!-- Soft glow for cursor -->
    <filter id="cursorGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Outer glow for accent -->
    <filter id="accentGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- macOS squircle background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bgGrad)"/>

  <!-- Subtle inner border -->
  <rect x="2" y="2" width="508" height="508" rx="106" ry="106" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- Memory rings (subtle neural motif) -->
  <circle cx="280" cy="240" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="1" opacity="0.35"/>
  <circle cx="280" cy="240" r="100" fill="none" stroke="url(#ringGrad)" stroke-width="0.8" opacity="0.25"/>
  <circle cx="280" cy="240" r="60" fill="none" stroke="url(#ringGrad)" stroke-width="0.6" opacity="0.15"/>

  <!-- Small memory nodes -->
  <circle cx="380" cy="160" r="4" fill="#5ba8ff" opacity="0.5"/>
  <circle cx="350" cy="340" r="3" fill="#8b5cf6" opacity="0.4"/>
  <circle cx="180" cy="320" r="3.5" fill="#5ba8ff" opacity="0.35"/>

  <!-- Connecting lines between nodes -->
  <line x1="380" y1="160" x2="350" y2="340" stroke="#5ba8ff" stroke-width="0.6" opacity="0.2"/>
  <line x1="350" y1="340" x2="180" y2="320" stroke="#8b5cf6" stroke-width="0.6" opacity="0.15"/>

  <!-- Accent glow behind cursor -->
  <ellipse cx="240" cy="270" rx="90" ry="100" fill="url(#glowGrad)" filter="url(#accentGlow)"/>

  <!-- Main cursor arrow -->
  <g filter="url(#shadow)" transform="translate(130, 100)">
    <!-- Cursor shape: clean geometric pointer -->
    <path d="M 60 30 L 60 270 L 100 225 L 145 310 L 180 295 L 135 210 L 185 210 Z"
          fill="url(#cursorGrad)"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linejoin="round"
          stroke-opacity="0.9"/>
    <!-- Glass highlight on cursor -->
    <path d="M 65 45 L 65 200 L 85 180 L 130 210 L 85 210 Z"
          fill="#ffffff"
          opacity="0.12"
          stroke="none"/>
  </g>

  <!-- Top-right accent dot (intelligence indicator) -->
  <circle cx="385" cy="115" r="14" fill="#5ba8ff" opacity="0.8" filter="url(#cursorGlow)"/>
  <circle cx="385" cy="115" r="5" fill="#ffffff" opacity="0.95"/>
</svg>
