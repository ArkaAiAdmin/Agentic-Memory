[workspace]
members = [
  "crates/fs-watcher",
  "crates/pty",
  "crates/git",
  "crates/process",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
