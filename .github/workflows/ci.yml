name: CI

# Runs on every push to main/development and every PR.
# Checks: ruff lint, mypy typecheck, pytest, coverage gate, drift checks.
# Extended/integration tests run weekly (see extended-tests.yml).

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .

  typecheck:
    name: Mypy Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install mypy + deps
        run: |
          pip install mypy --quiet
          pip install -e ".[dev,embeddings]" --quiet 2>/dev/null || pip install numpy pytest pytest-xdist mcp
      - name: Typecheck
        run: mypy
        env:
          MYPYPATH: .

  drift-checks:
    name: Drift Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          pip install -e ".[dev]" --quiet 2>/dev/null || pip install numpy pytest pytest-xdist mcp
      - name: Tool registry drift check
        run: python scripts/tool_drift_check.py
      - name: Documentation drift check
        run: python scripts/doc_drift_check.py
      - name: Schema version check
        run: python scripts/schema_version_check.py

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev,embeddings]" --quiet 2>/dev/null || pip install numpy pytest pytest-xdist mcp
      - name: Run tests
        env:
          MEMORY_RERANKER_DISABLED: "1"
          MEMORY_CTR_TUNING: "0"
          MEMORY_KNOWLEDGE_GRAPH: "1"
          MEMORY_EMBEDDINGS: "0"
        run: |
          . venv/bin/activate
          # ubuntu-latest has 2 cores; avoid OOM-killed xdist workers.
          # ``-n auto`` scales to CPU count. ``--dist=loadfile`` keeps
          # tests from the same file on the same worker to reduce races.
          python -m pytest eval/ \
            --tb=short -q \
            -n auto \
            --dist=loadfile \
            -p no:cacheprovider
        timeout-minutes: 45

  build-wheel:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          pip install build --quiet
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
