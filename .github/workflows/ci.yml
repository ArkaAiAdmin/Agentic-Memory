name: CI

# Runs on every push to main/development and every PR.
# Checks: ruff lint, mypy typecheck, pytest, coverage gate.
# Extended/integration tests run weekly (see extended-tests.yml).

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .

  typecheck:
    name: Mypy Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install mypy + deps
        run: |
          pip install mypy --quiet
          pip install -e ".[dev,embeddings]" --quiet 2>/dev/null || pip install numpy pytest pytest-xdist mcp
      - name: Typecheck
        run: mypy
        env:
          MYPYPATH: .

  test:
    name: pytest (cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev,embeddings]" --quiet 2>/dev/null || pip install numpy pytest pytest-cov pytest-xdist mcp
      - name: Run tests with coverage
        env:
          MEMORY_RERANKER_DISABLED: "1"
          MEMORY_CTR_TUNING: "0"
          MEMORY_KNOWLEDGE_GRAPH: "1"
          MEMORY_EMBEDDINGS: "0"
        run: |
          . venv/bin/activate
          # 2026-06-29: ubuntu-latest has 2 cores; -n 5 causes workers to be
          # OOM-killed or SIGTERM'd by the runner, producing xdist 'untrusted'
          # nodes and pytest-xdist 'node down: Not properly terminated' errors.
          # -n auto lets xdist pick a sensible worker count for the environment.
          # --timeout=60 kills any hung test per-worker so the job finishes.
          # --durations=10 surfaces slow tests in the CI log for investigation.
          python -m pytest eval/ \
            --tb=short -q \
            -n 2 \
            --dist=loadfile \
            --cov \
            --cov-report=xml \
            -p no:cacheprovider
        timeout-minutes: 45
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py3.12
          path: |
            coverage.xml
            .coverage
          retention-days: 14

  build-wheel:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          pip install build --quiet
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
