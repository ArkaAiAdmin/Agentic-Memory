name: Update Test Badge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-anyio mcp mypy
          pip install model2vec numpy usearch 2>/dev/null || echo "embeddings optional"

      - name: Get test count
        id: count
        run: |
          count=$(python -m pytest eval/ --collect-only -q 2>&1 | tail -1 | awk '{print $1}')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Update README badge
        run: |
          count=${{ steps.count.outputs.count }}
          sed -i "s|tests-[0-9]*%20passed|tests-${count}%20passed|g" README.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: update test badge to ${{ steps.count.outputs.count }} [skip ci]"
            git push
          fi
